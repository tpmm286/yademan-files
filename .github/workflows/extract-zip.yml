name: Extract ZIP and Remove AI Files

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-clean:
    name: Extract ZIP and Remove .ai Files
    runs-on: ubuntu-latest
    
    steps:
      - name: Clone Repository
        run: |
          git clone https://github.com/tpmm286/yademan-files.git repo
          cd repo

      - name: Extract ZIP Files
        run: |
          cd repo
          echo "=== Looking for ZIP files ==="
          ls -la
          
          echo "=== Extracting ZIP files ==="
          for zipfile in *.zip; do
            if [ -f "$zipfile" ]; then
              echo "Found and extracting: $zipfile"
              unzip -o "$zipfile" || echo "Failed to extract $zipfile"
            fi
          done

      - name: Remove .ai Files
        run: |
          cd repo
          echo "=== Removing .ai files ==="
          find . -name "*.ai" -type f -delete
          echo "Done removing .ai files"

      - name: Clean up ZIP files
        run: |
          cd repo
          echo "=== Removing ZIP files ==="
          find . -name "*.zip" -type f -delete
          
          echo "=== Final file list ==="
          find . -type f -not -path "./.git/*"

      - name: Commit and Push
        run: |
          cd repo
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A
          git commit -m "Extract ZIP and remove .ai files" || echo "No changes"
          git push https://${{ github.token }}@github.com/tpmm286/yademan-files.git main
