name: Extract ZIP and Remove AI Files

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-clean:
    name: Extract ZIP and Remove .ai Files
    runs-on: ubuntu-latest
    
    steps:
      - name: Extract ZIP Files
        run: |
          echo "=== Looking for ZIP files ==="
          ls -la
          
          echo "=== Extracting ZIP files ==="
          for zipfile in *.zip; do
            if [ -f "$zipfile" ]; then
              echo "Found and extracting: $zipfile"
              unzip -o "$zipfile" || echo "Failed to extract $zipfile"
            fi
          done

      - name: Remove .ai Files
        run: |
          echo "=== Removing .ai files ==="
          find . -name "*.ai" -type f -delete
          echo "Done removing .ai files"

      - name: Clean up ZIP files
        run: |
          echo "=== Removing ZIP files ==="
          find . -name "*.zip" -type f -delete
          
          echo "=== Final file list ==="
          ls -la

      - name: Git Config and Commit
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add -A
          git commit -m "Extract ZIP and remove .ai files" || echo "No changes"
          git push || echo "Push failed"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
