name: Extract ZIP and Remove AI Files

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-clean:
    name: Extract ZIP and Remove .ai Files
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Find and Extract ZIP Files
        run: |
          echo "=== Looking for ZIP files ==="
          ls -la
          
          echo "=== Extracting ZIP files ==="
          for zipfile in *.zip; do
            if [ -f "$zipfile" ]; then
              echo "Found and extracting: $zipfile"
              unzip -o "$zipfile" -d extracted/ || echo "Failed to extract $zipfile"
            fi
          done
          
          echo "=== Contents after extraction ==="
          ls -la extracted/ 2>/dev/null || echo "No extracted folder"

      - name: Remove .ai Files
        run: |
          echo "=== Removing .ai files ==="
          find . -name "*.ai" -type f -delete
          echo "Removed all .ai files"
          
          echo "=== Moving files to root ==="
          if [ -d "extracted" ]; then
            cp -r extracted/* . || true
            rm -rf extracted
          fi

      - name: Clean up
        run: |
          echo "=== Removing ZIP files ==="
          find . -name "*.zip" -type f -delete
          
          echo "=== Final file list ==="
          find . -type f -not -path "./.git/*" -not -path "./.github/*" | head -50

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --cached --quiet || (git commit -m "Extract ZIP files and remove .ai files" && git push)
