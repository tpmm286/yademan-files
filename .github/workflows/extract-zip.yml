name: Extract ZIP Files

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    name: Extract ZIP Files
    runs-on: ubuntu-latest
    
    steps:
      - name: Clone Repository
        run: |
          git clone https://github.com/tpmm286/yademan-files.git repo
          cd repo

      - name: Extract ZIP Files
        run: |
          cd repo
          echo "=== Looking for ZIP files ==="
          ls -la
          
          echo "=== Extracting ZIP files ==="
          for zipfile in *.zip; do
            if [ -f "$zipfile" ]; then
              echo "Found and extracting: $zipfile"
              unzip -o "$zipfile" || echo "Failed to extract $zipfile"
            fi
          done
          
          echo "=== Files after extraction ==="
          ls -la

      - name: Commit and Push
        run: |
          cd repo
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A
          git commit -m "Extract ZIP files" || echo "No changes"
          git push https://${{ github.token }}@github.com/tpmm286/yademan-files.git main
